<!doctype html>
<html><head><meta charset="utf-8"><title>page check</title>
<style>body{margin:0;background:#888} #info{padding:4px;font:12px sans-serif;color:#fff} #out svg{background:#fff;display:block;margin:8px auto;box-shadow:0 0 6px #000}</style>
</head><body><div id="info">loading…</div><div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/verovio@4.3.1/dist/verovio-toolkit-wasm.js"></script>
<script>
const q = new URLSearchParams(location.search);
const page = +(q.get('p') || 1);
const k = 9 / 3.625;   // A2 portrait with a 2.9 mm staff, expressed at Verovio's default unit
verovio.module.onRuntimeInitialized = async () => {
  const tk = new verovio.toolkit();
  const xml = await (await fetch('score.musicxml')).text();
  tk.setOptions({ pageWidth: Math.round(4200 * k), pageHeight: Math.round(5940 * k), scale: +(q.get('s') || 6),
                  breaks: 'encoded', header: 'none', footer: 'none', adjustPageHeight: false,
                  pageMarginTop: 150, pageMarginBottom: 150, pageMarginLeft: 150, pageMarginRight: 150 });
  tk.loadData(xml);
  document.getElementById('out').innerHTML = tk.renderToSVG(page);
  document.getElementById('info').textContent = 'page ' + page + ' / ' + tk.getPageCount();
};
</script></body></html>
